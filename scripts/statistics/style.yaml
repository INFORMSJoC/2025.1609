    font_weight: bold
    legend_font_size: 14
    legend_font_weight: bold
    line_width: 2
    marker: null
    grid_alpha: 0.6
    legend: {loc: lower right}
    series:
      order: [0.1, 0.2, 0.5]
      values:
        '0.1': {color: red, marker: o, markersize: 7, markerfacecolor: none, markeredgecolor: red, markeredgewidth: 1, label: '$\boldsymbol{p}^{\boldsymbol{s}}\mathbf{=0.1}$'}
        '0.2': {color: blue, marker: s, markersize: 7, markerfacecolor: none, markeredgecolor: blue, markeredgewidth: 1, label: '$\boldsymbol{p}^{\boldsymbol{s}}\mathbf{=0.2}$'}
        '0.5': {color: green, marker: D, markersize: 7, markerfacecolor: none, markeredgecolor: green, markeredgewidth: 1, label: '$\boldsymbol{p}^{\boldsymbol{s}}\mathbf{=0.5}$'}

  ijoc-figure3-theta-histogram:
    figure_size: [7.82, 4.81]
    font_size: 16
    font_weight: bold
    legend_font_size: 14
    legend_font_weight: bold
    line_width: 1.2
    grid_alpha: 0.6
    legend: {loc: upper right}
    series:
      order: [0.01, 0.1, 0.2]
      values:
        '0.01': {color: '#0D0885', edgecolor: '#0D0885', alpha: 0.75, label: '$\boldsymbol{\theta}\mathbf{=0.01}$'}
        '0.1': {color: '#5302A3', edgecolor: '#5302A3', alpha: 0.75, label: '$\boldsymbol{\theta}\mathbf{=0.1}$'}
        '0.2': {color: '#8B0AA5', edgecolor: '#8B0AA5', alpha: 0.75, label: '$\boldsymbol{\theta}\mathbf{=0.2}$'}

  ijoc-figure3-ps-histogram:
    figure_size: [7.82, 4.81]
    font_size: 16
    font_weight: bold
    legend_font_size: 14
    legend_font_weight: bold
    line_width: 1.2
    grid_alpha: 0.6
    legend: {loc: upper right}
    series:
      order: [0.1, 0.2, 0.5]
      values:
        '0.1': {color: red, edgecolor: red, alpha: 0.75, label: '$\boldsymbol{p}^{\boldsymbol{s}}\mathbf{=0.1}$'}
        '0.2': {color: blue, edgecolor: blue, alpha: 0.75, label: '$\boldsymbol{p}^{\boldsymbol{s}}\mathbf{=0.2}$'}
        '0.5': {color: green, edgecolor: green, alpha: 0.75, label: '$\boldsymbol{p}^{\boldsymbol{s}}\mathbf{=0.5}$'}

  ijoc-figure3-k-ratio:
    figure_size: [7.82, 4.81]
    font_size: 16
    font_weight: bold

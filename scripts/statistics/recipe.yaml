      xscale: log
      x_limits: [0.1, 100]
      x_ticks: [0.1, 1, 10, 25, 100]
      x_tick_labels: ['$\mathbf{10^{-1}}$', '$\mathbf{10^0}$', '$\mathbf{10^1}$', '$\mathbf{25}$', '$\mathbf{10^2}$']

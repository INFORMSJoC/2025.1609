      group: method
      profile_boundary: {start_at_xmin: true, extend_to_xmax: true, marker: false, clip_values_to_x_limits: true}
      xscale: log
      x_limits: [0.01, 30]
      x_ticks: [0.01, 0.1, 1, 10, 30]
      x_tick_labels: ['$\mathbf{10^{-2}}$', '$\mathbf{10^{-1}}$', '$\mathbf{10^0}$', '$\mathbf{10}$', '$\mathbf{30}$']

# Project-owned visual policies.  Engine keys remain generic; the policy name
# and its connection to an IJOC artifact are MPCLP-specific.
styles:
  ijoc-figure1-time:
    figure_size: [8, 5]
    font_size: 16
    font_weight: bold
    legend_font_size: 16
    legend_font_weight: bold
    line_width: 2
    marker: null
    grid_alpha: 0.6
    legend: {loc: lower right}
    series:
      order: [B&C-B, B&C-I]
      values:
        B&C-B: {color: r, marker: o, markersize: 7, markerfacecolor: none, markeredgecolor: r, markeredgewidth: 1, label: B&C-B}
        B&C-I: {color: g, marker: s, markersize: 7, markerfacecolor: none, markeredgecolor: g, markeredgewidth: 1, label: B&C-I}

  ijoc-figure1-gap:
    figure_size: [8, 5]
    font_size: 16
    font_weight: bold
    legend_font_size: 16
    legend_font_weight: bold
    line_width: 2
    marker: null
    grid_alpha: 0.6
    legend: {loc: lower right}
    series:
      order: [B&C-B, B&C-I]
      values:
        B&C-B: {color: r, marker: o, markersize: 7, markerfacecolor: none, markeredgecolor: r, markeredgewidth: 1, label: B&C-B}
        B&C-I: {color: g, marker: s, markersize: 7, markerfacecolor: none, markeredgecolor: g, markeredgewidth: 1, label: B&C-I}

  ijoc-figure2-theta:
    # Tuned to the legacy Figure 2 EPS bounding box (557 x 339 pt).
    figure_size: [7.82, 4.81]
    font_size: 16
    font_weight: bold
    legend_font_size: 14
    legend_font_weight: bold
    line_width: 2
    marker: null
    grid_alpha: 0.6
    legend: {loc: lower right}
    series:
      order: [0.01, 0.1, 0.2]
      values:
        '0.01': {color: '#0D0885', marker: o, markersize: 7, markerfacecolor: none, markeredgecolor: '#0D0885', markeredgewidth: 1, label: '$\boldsymbol{\theta}\mathbf{=0.01}$'}
        '0.1': {color: '#5302A3', marker: s, markersize: 7, markerfacecolor: none, markeredgecolor: '#5302A3', markeredgewidth: 1, label: '$\boldsymbol{\theta}\mathbf{=0.1}$'}
        '0.2': {color: '#8B0AA5', marker: D, markersize: 7, markerfacecolor: none, markeredgecolor: '#8B0AA5', markeredgewidth: 1, label: '$\boldsymbol{\theta}\mathbf{=0.2}$'}

  ijoc-figure2-ps:
    # Tuned to the legacy Figure 2 EPS bounding box (557 x 339 pt).
    figure_size: [7.82, 4.81]
    font_size: 16
    font_weight: bold
    legend_font_size: 14
    legend_font_weight: bold
    line_width: 2
    marker: null
    grid_alpha: 0.6
    legend: {loc: lower right}
    series:
      order: [0.1, 0.2, 0.5]
      values:
        '0.1': {color: red, marker: o, markersize: 7, markerfacecolor: none, markeredgecolor: red, markeredgewidth: 1, label: '$\boldsymbol{p}^{\boldsymbol{s}}\mathbf{=0.1}$'}
        '0.2': {color: blue, marker: s, markersize: 7, markerfacecolor: none, markeredgecolor: blue, markeredgewidth: 1, label: '$\boldsymbol{p}^{\boldsymbol{s}}\mathbf{=0.2}$'}
        '0.5': {color: green, marker: D, markersize: 7, markerfacecolor: none, markeredgecolor: green, markeredgewidth: 1, label: '$\boldsymbol{p}^{\boldsymbol{s}}\mathbf{=0.5}$'}

  ijoc-figure2-k-ratio:
    figure_size: [7.82, 4.81]
    font_size: 16
    font_weight: bold
    legend_font_size: 14
    legend_font_weight: bold
    line_width: 2
    marker: null
    grid_alpha: 0.6
    legend: {loc: lower right}
    series:
      order: [0-5%, 10%, 20%, 1/3]
      values:
        0-5%: {color: '#0D0885', marker: o, markersize: 7, markerfacecolor: none, markeredgecolor: '#0D0885', markeredgewidth: 1, label: '$\boldsymbol{K/|I|\leq 5\%}$'}
        10%: {color: '#5302A3', marker: s, markersize: 7, markerfacecolor: none, markeredgecolor: '#5302A3', markeredgewidth: 1, label: '$\boldsymbol{K/|I|=10\%}$'}
        20%: {color: '#8B0AA5', marker: D, markersize: 7, markerfacecolor: none, markeredgecolor: '#8B0AA5', markeredgewidth: 1, label: '$\boldsymbol{K/|I|=20\%}$'}
        1/3: {color: '#CC4778', marker: '^', markersize: 7, markerfacecolor: none, markeredgecolor: '#CC4778', markeredgewidth: 1, label: '$\boldsymbol{K/|I|\geq 33\%}$'}


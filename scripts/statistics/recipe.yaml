      input: t2_figure3
      x: ncl_over_nl_pct
      group: k_ratio_group
      filter: {k_ratio_selected: selected}
      profile_boundary: {start_at_xmin: true, extend_to_xmax: true, marker: false, clip_values_to_x_limits: true}
      xscale: linear
      x_limits: [0, 100]
      x_ticks: [0, 25, 50, 75, 100]
      x_tick_labels: ['0', '25', '50', '75', '100']
      y_limits: [-0.05, 1.05]
      y_ticks: [0, 0.25, 0.5, 0.75, 1]
      y_tick_labels: ['0', '25', '50', '75', '100']
      y_as_percent: false
      labels: {x: 'nCL / nL [%]', y: '# Instances [%]'}
      layout: *figure3_fixed_layout
      savefig: {transparent: true, bbox_inches: null, pad_inches: 0}
      style: ijoc-figure3-k-ratio
      formats: [eps]

    - id: Figure3-T2-MCL-By-K-Ratio
      preset: grouped_categorical_histogram
      input: t2_figure3
      x: mcl
      group: k_ratio_group
      filter: {k_ratio_selected: selected}
      categories: [1, 2, 3, 4, 5, 6, 7, 8]
      bar_width: 0.18
      normalization: percentage
      y_limits: [0, 105]
      y_ticks: [0, 25, 50, 75, 100]
      labels: {x: 'mCL', y: '# Instances [%]'}
      layout: *figure3_fixed_layout
      savefig: {transparent: true, bbox_inches: null, pad_inches: 0}
      style: ijoc-figure3-k-ratio-histogram
      formats: [eps]

    - id: Figure4-T2-CPU-Time-Profile
      preset: censored_empirical_profile
      input: t2_figure4
      x: runtime_seconds
      group: method
      right_censoring: 3600
      profile_boundary: {start_at_xmin: true, extend_to_xmax: true, marker: false, clip_values_to_x_limits: true}
      xscale: log
      x_limits: [1, 3600]
      x_ticks: [1, 10, 100, 1000, 3600]

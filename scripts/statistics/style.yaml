      values:
        '0-5%': {color: '#0D0885', edgecolor: '#0D0885', alpha: 0.75, label: '$\boldsymbol{K/|I|\leq 5\%}$'}
        '10%': {color: '#5302A3', edgecolor: '#5302A3', alpha: 0.75, label: '$\boldsymbol{K/|I|=10\%}$'}

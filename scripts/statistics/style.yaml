    font_weight: bold
    legend_font_size: 14
    legend_font_weight: bold
    line_width: 2
    marker: null
    grid_alpha: 0.6
    legend: {loc: lower right}
    series:
      order: [B&C-I, B&C-NC-I, B&C-NC-B]
      values:
        B&C-I: {color: green, marker: s, markersize: 7, markerfacecolor: none, markeredgecolor: green, markeredgewidth: 1, label: B&C-I}
        B&C-NC-I: {color: blue, marker: D, markersize: 7, markerfacecolor: none, markeredgecolor: blue, markeredgewidth: 1, label: B&C-NC-I}
        B&C-NC-B: {color: red, marker: o, markersize: 7, markerfacecolor: none, markeredgecolor: red, markeredgewidth: 1, label: B&C-NC-B}

  ijoc-figure5-gap:
